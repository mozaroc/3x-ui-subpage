{{define "page-routing-list"}}
<h1>Routing rules</h1>
{{if .Data.Error}}<div class="error">{{.Data.Error}}</div>{{end}}
<div class="card">
  <a class="btn btn--primary" href="/admin/routing/new">+ New rule</a>
</div>
<div class="card">
  <table>
    <tr><th>Profile</th><th>Order</th><th>Type</th><th>Value</th><th>Outbound</th><th>Enabled</th><th></th></tr>
    {{range .Data.Rules}}
    <tr>
      <td>{{.Profile}}</td>
      <td>{{.SortOrder}}</td>
      <td>{{.Type}}</td>
      <td>{{.Value}}</td>
      <td>{{.Outbound}}</td>
      <td>{{if .Enabled}}yes{{else}}no{{end}}</td>
      <td class="row">
        <a class="btn btn--secondary" href="/admin/routing/{{.ID}}/edit">Edit</a>
        <form method="post" action="/admin/routing/{{.ID}}/delete" onsubmit="return confirm('Delete this rule?');">
          <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
          <button class="btn btn--danger" type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {{end}}
  </table>
</div>
{{end}}
