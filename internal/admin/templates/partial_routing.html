{{define "routing-fields"}}
<div class="form-section">
  <div class="form-section__title">Routing (Happ / Incy)</div>
  <p class="hint">
    Paste a Base64 routing string generated on the
    <a href="/admin/routing">Routing Generator</a> page. When enabled, it's
    embedded automatically into this user's Happ and Incy deep links; when
    disabled or left blank, those clients get no routing configuration at
    all.
  </p>
  <div class="form-grid">
    <div class="field field--sm">
      <label>Enable routing</label>
      <input type="checkbox" name="routing_enabled" value="1" {{if .Enabled}}checked{{end}}>
    </div>
  </div>
  <div class="field field--full">
    <label>Routing configuration (Base64)</label>
    <textarea name="routing_b64" rows="4" class="mono" placeholder="eyJOYW1lIjoi...">{{.B64}}</textarea>
  </div>
</div>
{{end}}
