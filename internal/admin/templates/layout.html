{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — 3x-ui Subscription Service</title>
  <script>
    (function () {
      var KEY = "3xui-subpage-theme";
      var stored = null;
      try { stored = localStorage.getItem(KEY); } catch (e) {}
      var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", stored || system);
      document.addEventListener("click", function (e) {
        var themeBtn = e.target.closest("[data-theme-toggle]");
        if (themeBtn) {
          var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          try { localStorage.setItem(KEY, next); } catch (e) {}
          return;
        }
        var copyBtn = e.target.closest("[data-copy]");
        if (copyBtn) {
          var text = copyBtn.getAttribute("data-copy");
          navigator.clipboard.writeText(text).then(function () {
            var original = copyBtn.textContent;
            copyBtn.textContent = "Copied!";
            setTimeout(function () { copyBtn.textContent = original; }, 1500);
          });
        }
      });
    })();
  </script>
  <style>
    :root {
      --bg-page: #e6e8ec;
      --bg-card: #ffffff;
      --bg-surface: #f5f6f8;
      --border: #d9dde3;
      --text: #1f2329;
      --text-muted: #6b7280;
      --primary: #1677ff;
      --primary-contrast: #ffffff;
      --success: #52c41a;
      --warning: #faad14;
      --danger: #ff4d4f;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-card: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    }
    :root[data-theme="dark"] {
      --bg-page: #1a1b1f;
      --bg-card: #23252b;
      --bg-surface: #2c2f36;
      --border: #363a42;
      --text: #e8eaed;
      --text-muted: #9aa0ac;
      --primary: #3d8bfd;
      --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--primary); }
    h1 { font-size: 1.4rem; margin: 0 0 20px; }
    h2 { font-size: 1rem; margin: 0 0 12px; color: var(--text); }

    /* --- nav --- */
    .nav {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 20px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-brand { font-weight: 700; color: var(--text); text-decoration: none; margin-right: 4px; }
    .nav-links { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; flex: 1; }
    .nav a { text-decoration: none; color: var(--text-muted); font-size: .88rem; font-weight: 500; padding: 8px 12px; border-radius: var(--radius-sm); }
    .nav a:hover { color: var(--text); background: var(--bg-surface); }
    .nav-spacer { flex: 1; }
    .nav form { margin: 0; }
    .theme-toggle {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text); padding: 0;
    }
    .theme-toggle svg { width: 16px; height: 16px; }
    .theme-toggle .sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .sun { display: block; }

    .nav-toggle { position: absolute; opacity: 0; pointer-events: none; }
    .nav-toggle-label { display: none; }

    @media (max-width: 768px) {
      .nav-toggle-label {
        display: inline-flex; align-items: center; justify-content: center;
        width: 34px; height: 34px; border-radius: var(--radius-sm);
        border: 1px solid var(--border); cursor: pointer; margin-left: auto; color: var(--text);
      }
      .nav-links {
        display: none; flex-basis: 100%; flex-direction: column; align-items: stretch;
        gap: 2px; padding-top: 8px;
      }
      .nav-toggle:checked ~ .nav-links { display: flex; }
      .nav a { padding: 10px 12px; }
      .nav-spacer { display: none; }
      .nav-links > .theme-toggle, .nav-links > form { align-self: flex-start; margin-top: 4px; }
    }

    /* --- page layout --- */
    .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px; }
    @media (max-width: 480px) { .container { padding: 14px; } }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 20px;
      margin-bottom: 20px;
    }

    /* --- form structure --- */
    .form-section { margin-bottom: 24px; }
    .form-section:last-child { margin-bottom: 0; }
    .form-section__title {
      font-size: .75rem; text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-muted); font-weight: 600; margin-bottom: 12px;
      border-bottom: 1px solid var(--border); padding-bottom: 8px;
    }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 16px; }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field label { font-size: .8rem; color: var(--text-muted); font-weight: 500; }
    .field--full { grid-column: 1 / -1; }
    .field--sm { max-width: 140px; }
    .field--md { max-width: 320px; }
    .field--lg { max-width: 480px; }
    @media (max-width: 480px) {
      .field--sm, .field--md, .field--lg { max-width: none; }
    }
    .field-value { font-size: .9rem; color: var(--text); word-break: break-word; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .82rem; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px 20px; margin-bottom: 18px; }

    input[type=text], input[type=password], input[type=number], input[type=date], textarea, select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: .9rem;
      line-height: 1.4;
    }
    input:focus, textarea:focus, select:focus {
      outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary);
    }
    textarea { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; min-height: 100px; resize: vertical; }
    textarea.code { min-height: 320px; font-size: .85rem; }

    /* --- toggle switch (checkbox replacement) --- */
    .switch-field { display: flex; align-items: center; gap: 10px; }
    .switch-field > label { font-size: .85rem; color: var(--text); font-weight: 400; }
    .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch .track { position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: background .15s; }
    .switch .track:before {
      content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: transform .15s;
    }
    .switch input:checked ~ .track { background: var(--primary); }
    .switch input:checked ~ .track:before { transform: translateX(16px); }

    /* --- buttons --- */
    .actions, .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .actions { margin-top: 16px; }
    .form-section .actions, .card > .actions:first-child { margin-top: 0; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid transparent;
      cursor: pointer; font-size: .85rem; font-weight: 500; text-decoration: none; line-height: 1.4;
    }
    .btn--primary { background: var(--primary); color: var(--primary-contrast); }
    .btn--danger { background: var(--danger); color: #fff; }
    .btn--secondary { background: var(--bg-surface); color: var(--text); border-color: var(--border); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* --- tables --- */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: .85rem; white-space: nowrap; }
    th { color: var(--text-muted); font-weight: 600; font-size: .72rem; text-transform: uppercase; letter-spacing: .03em; }
    td.wrap, th.wrap { white-space: normal; }

    /* --- badges --- */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 10px; border-radius: 999px; font-size: .75rem; font-weight: 600;
      background: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border);
      white-space: nowrap;
    }
    .badge--success { background: rgba(82,196,26,.12); color: var(--success); border-color: rgba(82,196,26,.35); }
    .badge--danger { background: rgba(255,77,79,.12); color: var(--danger); border-color: rgba(255,77,79,.35); }
    .badge--warning { background: rgba(250,173,20,.12); color: var(--warning); border-color: rgba(250,173,20,.35); }

    .error {
      background: rgba(255,77,79,.1); border: 1px solid var(--danger); color: var(--danger);
      padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: .9rem;
    }
    .hint { font-size: .8rem; color: var(--text-muted); margin-top: 4px; }

    /* --- dashboard grid --- */
    .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
    .dash-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 18px; }
    .dash-card h3 { margin: 0 0 6px; font-size: 1rem; }
    .dash-card h3 a { text-decoration: none; color: var(--text); }
    .dash-card h3 a:hover { color: var(--primary); }
    .dash-card p { margin: 0; font-size: .85rem; color: var(--text-muted); }

    /* --- subscription QR/copy block --- */
    .qr-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .qr-row__image { border-radius: var(--radius-sm); background: #fff; padding: 8px; flex-shrink: 0; }
    .qr-row__details { flex: 1; min-width: 240px; }
    .copy-row { display: flex; gap: 8px; }
    .copy-row input { flex: 1; min-width: 0; }
  </style>
</head>
<body>
{{if .Username}}
<nav class="nav">
  <a href="/admin/" class="nav-brand">3x-ui Sub</a>
  <input type="checkbox" id="nav-toggle" class="nav-toggle">
  <label for="nav-toggle" class="nav-toggle-label" aria-label="Menu">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </label>
  <div class="nav-links">
    <a href="/admin/">Dashboard</a>
    <a href="/admin/settings">Settings</a>
    <a href="/admin/applications">Applications</a>
    <a href="/admin/themes">Themes</a>
    <a href="/admin/templates">Templates</a>
    <a href="/admin/assignments">Assignments</a>
    <a href="/admin/routing">Routing</a>
    <a href="/admin/users">Users</a>
    <a href="/admin/sync">Sync</a>
    <span class="nav-spacer"></span>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle color theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <form method="post" action="/admin/logout">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button class="btn btn--secondary" type="submit">Logout ({{.Username}})</button>
    </form>
  </div>
</nav>
{{end}}
<main class="container">
{{.Body}}
</main>
</body>
</html>
{{end}}
