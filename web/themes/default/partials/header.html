{{define "header"}}
<header class="site-header">
  <div class="container site-header__inner">
    <img class="site-header__logo" src="{{.Theme.Logo}}" alt="{{.Theme.Name}}">
    <span class="site-header__title">{{.Theme.Name}}</span>
    <span class="site-header__spacer"></span>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle color theme">
      <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
{{end}}
