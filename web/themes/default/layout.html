{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Theme.Name}} — Subscription</title>
  <link rel="icon" href="{{.Theme.Favicon}}">
  <link rel="stylesheet" href="/assets/{{.Theme.Slug}}/css/style.css">
  <style>
    :root {
      {{range $k, $v := .Theme.Colors}}--color-{{$k}}: {{$v}};
      {{end}}--font-body: {{index .Theme.Fonts "body"}};
      --font-mono: {{index .Theme.Fonts "mono"}};
    }
  </style>
</head>
<body>
{{template "header" .}}
<main class="container">
{{template "content" .}}
</main>
{{template "footer" .}}
<script src="/assets/{{.Theme.Slug}}/js/app.js"></script>
</body>
</html>
{{end}}
