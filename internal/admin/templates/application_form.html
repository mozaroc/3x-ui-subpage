{{define "page-application-form"}}
<h1>{{if .Data.IsNew}}New application{{else}}Edit application{{end}}</h1>
{{if .Data.Error}}<div class="error">{{.Data.Error}}</div>{{end}}
<div class="card">
  <form method="post" action="{{if .Data.IsNew}}/admin/applications{{else}}/admin/applications/{{.Data.App.ID}}{{end}}">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

    <div class="form-section">
      <div class="form-section__title">Identity</div>
      <div class="form-grid">
        <div class="field field--md">
          <label>Name</label>
          <input type="text" name="name" value="{{.Data.App.Name}}" required>
        </div>
        <div class="field field--md">
          <label>Icon (filename)</label>
          <input type="text" name="icon" value="{{.Data.App.Icon}}">
        </div>
        <div class="field field--full">
          <label>Description</label>
          <input type="text" name="description" value="{{.Data.App.Description}}">
        </div>
        <div class="field field--md">
          <label>Platforms (comma-separated)</label>
          <input type="text" name="platforms" value="{{.Data.PlatformsCSV}}" placeholder="Windows, macOS, Linux">
        </div>
        <div class="field field--sm">
          <label>Sort order</label>
          <input type="number" name="sort_order" value="{{.Data.App.SortOrder}}">
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section__title">Links</div>
      <div class="form-grid">
        <div class="field field--full">
          <label>Download URL</label>
          <input type="text" name="download" value="{{.Data.App.Download}}">
        </div>
        <div class="field field--full">
          <label>Deeplink template (supports &#123;subscription&#125;, &#123;profileTitle&#125;)</label>
          <input type="text" name="deeplink" value="{{.Data.App.Deeplink}}">
        </div>
        <div class="field field--full">
          <label>Instructions</label>
          <input type="text" name="instructions" value="{{.Data.App.Instructions}}">
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="switch-field">
        <span class="switch">
          <input type="checkbox" name="visible" value="1" {{if .Data.App.Visible}}checked{{end}}>
          <span class="track"></span>
        </span>
        <label>Visible on the subscription page</label>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn--primary" type="submit">Save</button>
      <a class="btn btn--secondary" href="/admin/applications">Cancel</a>
    </div>
  </form>
</div>
{{end}}
